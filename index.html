<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Brawl Helper</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 210, 0, 0.25), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(255, 25, 35, 0.25), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(0, 145, 255, 0.28), transparent 35%),
        linear-gradient(135deg, #151525 0%, #202340 45%, #10111f 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 2px, transparent 2px);
      background-size: 42px 42px;
      pointer-events: none;
      opacity: 0.45;
    }

    .page {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .topbar {
      height: 88px;
      padding: 14px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      background: rgba(11, 12, 24, 0.78);
      border-bottom: 4px solid rgba(0, 0, 0, 0.7);
      box-shadow: 0 12px 0 rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(14px);
    }

    .logo-button {
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      color: white;
      text-decoration: none;
      transition: transform 0.14s ease, filter 0.14s ease;
      flex-shrink: 0;
    }

    .logo-button:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.08);
    }

    .logo-button:active {
      transform: translateY(2px) scale(0.97);
      filter: brightness(0.92);
    }

    .logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      filter: drop-shadow(0 7px 0 rgba(0, 0, 0, 0.5));
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1;
    }

    .logo-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-shadow:
        0 4px 0 #000000,
        2px 0 0 #000000,
        -2px 0 0 #000000,
        0 -2px 0 #000000;
    }

    .logo-subtitle {
      margin-top: 6px;
      color: #ffd21a;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #000000;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: nowrap;
    }

    .nav-button,
    .main-button {
      position: relative;
      border: 4px solid #000000;
      cursor: pointer;
      color: #ffffff;
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      text-decoration: none;
      text-align: center;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      overflow: visible;
      appearance: none;
      -webkit-appearance: none;

      background: linear-gradient(180deg, #ff4a4a 0%, #d91520 55%, #9c0912 100%);
      box-shadow:
        0 7px 0 #5a050b,
        0 13px 24px rgba(0, 0, 0, 0.4),
        inset 0 3px 0 rgba(255, 255, 255, 0.45);

      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        filter 0.12s ease;
    }

    .button-label {
      display: block;
      color: #ffffff;
      line-height: 1.2;
      padding: 2px 0 5px;
      -webkit-text-stroke: 1px #000000;
      paint-order: stroke fill;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8);
    }

    .nav-button {
      min-width: 122px;
      min-height: 52px;
      padding: 9px 18px 12px;
      border-radius: 16px;
      font-size: 17px;
    }

    .nav-button.yellow {
      background: linear-gradient(180deg, #ffe05a 0%, #ffb31a 55%, #d06b00 100%);
      box-shadow:
        0 7px 0 #814100,
        0 13px 24px rgba(0, 0, 0, 0.4),
        inset 0 3px 0 rgba(255, 255, 255, 0.55);
    }

    .nav-button.blue {
      background: linear-gradient(180deg, #48c8ff 0%, #1686ff 55%, #0050b8 100%);
      box-shadow:
        0 7px 0 #00336e,
        0 13px 24px rgba(0, 0, 0, 0.4),
        inset 0 3px 0 rgba(255, 255, 255, 0.45);
    }

    .nav-button.gray {
      background: linear-gradient(180deg, #777b8a 0%, #4a4f61 55%, #252936 100%);
      box-shadow:
        0 7px 0 #10131d,
        0 13px 24px rgba(0, 0, 0, 0.4),
        inset 0 3px 0 rgba(255, 255, 255, 0.28);
    }

    .nav-button:hover,
    .main-button:hover {
      transform: translateY(-3px) scale(1.035);
      filter: brightness(1.12) saturate(1.12);
    }

    .nav-button:active,
    .main-button:active {
      transform: translateY(5px) scale(0.98);
      box-shadow:
        0 2px 0 rgba(0, 0, 0, 0.85),
        0 8px 18px rgba(0, 0, 0, 0.35),
        inset 0 2px 0 rgba(255, 255, 255, 0.25);
    }

    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .home-card {
      width: min(720px, 100%);
      min-height: 390px;
      padding: 58px 34px 44px;
      border-radius: 36px;
      position: relative;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 44px;
      text-align: center;

      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.07)),
        linear-gradient(135deg, rgba(255, 35, 48, 0.22), rgba(255, 210, 0, 0.14));
      border: 5px solid #000000;
      box-shadow:
        0 14px 0 rgba(0, 0, 0, 0.72),
        0 32px 70px rgba(0, 0, 0, 0.5),
        inset 0 4px 0 rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(16px);
    }

    .home-card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      top: -95px;
      right: -70px;
      border-radius: 50%;
      background: #ffd21a;
      border: 5px solid #000000;
      opacity: 0.9;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.35);
    }

    .home-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      bottom: -85px;
      left: -60px;
      border-radius: 50%;
      background: #ff1f2d;
      border: 5px solid #000000;
      opacity: 0.9;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.35);
    }

    .card-content {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 68px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -0.055em;
      color: #ffffff;
      text-shadow:
        0 6px 0 #000000,
        3px 0 0 #000000,
        -3px 0 0 #000000,
        0 -3px 0 #000000;
    }

    .accent {
      display: block;
      margin-top: 8px;
      color: #ffd21a;
      text-shadow:
        0 6px 0 #000000,
        3px 0 0 #000000,
        -3px 0 0 #000000,
        0 -3px 0 #000000;
    }

    .main-button-wrap {
      position: relative;
      z-index: 2;
    }

    .main-button {
      min-width: 340px;
      min-height: 84px;
      padding: 18px 44px 24px;
      border-radius: 24px;
      font-size: 30px;
      background: linear-gradient(180deg, #ffe866 0%, #ffb51f 55%, #df7000 100%);
      box-shadow:
        0 10px 0 #824200,
        0 20px 36px rgba(0, 0, 0, 0.42),
        inset 0 4px 0 rgba(255, 255, 255, 0.58);
    }

    .main-button .button-label {
      padding: 3px 0 7px;
      font-size: 30px;
      -webkit-text-stroke: 1.2px #000000;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.8);
    }

    @media (max-width: 900px) {
      .topbar {
        height: auto;
        padding: 12px 16px;
        align-items: flex-start;
        flex-direction: column;
      }

      .nav {
        width: 100%;
        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 8px;
      }

      .nav-button {
        min-width: 120px;
        min-height: 50px;
        flex: 1;
        padding: 9px 8px 12px;
        font-size: 15px;
      }

      .logo-img {
        width: 56px;
        height: 56px;
      }

      .logo-title {
        font-size: 22px;
      }

      .content {
        padding: 18px;
      }

      .home-card {
        min-height: 360px;
        padding: 42px 20px 34px;
        border-radius: 30px;
        gap: 36px;
      }

      h1 {
        font-size: clamp(34px, 9vw, 50px);
      }

      .main-button {
        min-width: 280px;
        min-height: 74px;
        font-size: 25px;
        padding: 16px 32px 22px;
      }

      .main-button .button-label {
        font-size: 25px;
      }
    }

    @media (max-width: 420px) {
      .nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .home-card {
        min-height: 345px;
      }

      .main-button {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>

<body>
  <main class="page" id="home">
    <header class="topbar">
      <a class="logo-button" href="#home" aria-label="Вернуться на главную">
        <img class="logo-img" src="assets/images/Logo_BH.webp" alt="Brawl Helper logo" />

        <span class="logo-text">
          <span class="logo-title">Brawl Helper</span>
          <span class="logo-subtitle">Ranked draft tool</span>
        </span>
      </a>

      <nav class="nav">
        <button class="nav-button yellow" type="button">
          <span class="button-label">Главная</span>
        </button>

        <button class="nav-button blue" type="button">
          <span class="button-label">Драфт</span>
        </button>

        <button class="nav-button" type="button">
          <span class="button-label">Бойцы</span>
        </button>

        <button class="nav-button gray" type="button">
          <span class="button-label">Карты</span>
        </button>
      </nav>
    </header>

    <section class="content">
      <div class="home-card">
        <div class="card-content">
          <h1>
            Помошник в пике
            <span class="accent">для Рангового боя</span>
          </h1>
        </div>

        <div class="main-button-wrap">
          <button class="main-button" type="button">
            <span class="button-label">Начать драфт</span>
          </button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
