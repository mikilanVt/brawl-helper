<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brawl Helper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 204, 0, 0.18), transparent 32%),
        radial-gradient(circle at 80% 15%, rgba(255, 70, 85, 0.2), transparent 34%),
        radial-gradient(circle at 50% 90%, rgba(0, 170, 255, 0.2), transparent 38%),
        linear-gradient(135deg, #101525, #171b2e 45%, #0b0f1d);
    }

    .page {
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(620px, 100%);
      min-height: 360px;
      padding: 46px 34px 34px;
      border-radius: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;

      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.07));
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      top: -90px;
      right: -70px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 204, 0, 0.45), rgba(255, 70, 85, 0.22));
      filter: blur(2px);
      opacity: 0.9;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      bottom: -80px;
      left: -60px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0, 170, 255, 0.35), rgba(120, 90, 255, 0.28));
      filter: blur(2px);
      opacity: 0.9;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .logo {
      width: 74px;
      height: 74px;
      margin: 0 auto 24px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 34px;
      font-weight: 900;

      background: linear-gradient(135deg, #ffcc00, #ff4655);
      box-shadow: 0 16px 38px rgba(255, 70, 85, 0.28);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 58px);
      line-height: 1.02;
      letter-spacing: -0.06em;
      font-weight: 950;
      text-wrap: balance;
    }

    .accent {
      display: block;
      margin-top: 8px;
      background: linear-gradient(90deg, #ffcc00, #ff7a18, #ff4655);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .button-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 36px;
    }

    button {
      border: 0;
      cursor: pointer;
      padding: 17px 34px;
      border-radius: 18px;
      color: #171717;
      font-size: 18px;
      font-weight: 950;
      letter-spacing: -0.02em;

      background: linear-gradient(135deg, #ffdc3d, #ff9f1c);
      box-shadow:
        0 18px 36px rgba(255, 159, 28, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.02);
      filter: brightness(1.05);
      box-shadow:
        0 24px 46px rgba(255, 159, 28, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    button:active {
      transform: translateY(0) scale(0.98);
    }

    @media (max-width: 480px) {
      .page {
        padding: 16px;
      }

      .card {
        min-height: 330px;
        padding: 36px 22px 28px;
        border-radius: 28px;
      }

      .logo {
        width: 64px;
        height: 64px;
        font-size: 30px;
        border-radius: 20px;
      }

      button {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="content">
        <div class="logo">BH</div>

        <h1>
          Помошник в пике
          <span class="accent">для Рангового боя</span>
        </h1>
      </div>

      <div class="button-wrap">
        <button type="button">Начать драфт</button>
      </div>
    </section>
  </main>
</body>
</html>
